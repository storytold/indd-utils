[package]
name = "indd"
version = "0.1.0"
edition = "2024"
description = "Reader for INDD files and converter to IDML"
license = "MIT OR Apache-2.0"
repository = "https://github.com/storytold/indd-utils"
publish = false

[dependencies]
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; CONTRIBUTING.md).
# std-only (no clock/wasmbind) so the wasm build stays byte-for-byte identical to native.
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
